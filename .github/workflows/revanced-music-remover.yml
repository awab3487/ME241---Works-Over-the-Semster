name: Build ReVanced music remover

on:
  push:
    paths:
      - "revanced/**"
      - ".github/workflows/revanced-music-remover.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build patches
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revanced
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        env:
          # ReVanced Patcher and its Gradle plugin are published to GitHub Packages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:musicremover:test :patches:buildAndroid --no-daemon --stacktrace

      - name: Upload patches file
        uses: actions/upload-artifact@v4
        with:
          name: music-remover-patches
          path: revanced/patches/build/libs/*.rvp

      - name: Publish patches file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PATCHES_FILE=$(ls patches/build/libs/*.rvp)
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/music-remover-latest"

          # ReVanced Manager can add patches from a URL to a JSON file in the ReVanced API format,
          # which also lets it update the patches automatically.
          cat > patches-bundle.json <<EOF
          {
            "download_url": "$RELEASE_URL/$(basename "$PATCHES_FILE")",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%S)",
            "description": "Removes background music from YouTube videos while keeping voices",
            "version": "$(grep '^version' gradle.properties | cut -d= -f2 | tr -d ' ')-$GITHUB_RUN_NUMBER"
          }
          EOF

          gh release delete music-remover-latest --cleanup-tag --yes || true
          gh release create music-remover-latest "$PATCHES_FILE" patches-bundle.json \
            --target "$GITHUB_SHA" \
            --title "Music remover for ReVanced (latest build)" \
            --notes "In ReVanced Manager: Patches > ✏️ > + > Enter URL, and paste $RELEASE_URL/patches-bundle.json. Built from $GITHUB_SHA."
